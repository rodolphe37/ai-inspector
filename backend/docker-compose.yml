# Local infrastructure for the AI Inspector API.
#
#   docker compose up -d db          # just Postgres (run the API on the host)
#   docker compose --profile api up  # Postgres + the API in a container
#
# The API defaults to SQLite, so Postgres is entirely optional. To use it,
# set in backend/.env:
#   DATABASE_URL=postgresql+psycopg://ai_inspector:ai_inspector@localhost:5432/ai_inspector

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ai_inspector
      POSTGRES_PASSWORD: ai_inspector
      POSTGRES_DB: ai_inspector
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai_inspector"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    profiles: ["api"]
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://ai_inspector:ai_inspector@db:5432/ai_inspector
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
